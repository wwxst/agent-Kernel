name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + 全部用例；不需要 API Key，不联网。
      - name: Run checks
        run: npm run check
