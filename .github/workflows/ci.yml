name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + 全部用例；不需要 API Key，不联网。
      - name: Run checks
        run: npm run check

      # 评测自检也不调用模型：验证每个任务的初始夹具确实会让检查失败。
      - name: Self-check the evaluation set
        run: npm run eval:check

  # 和上面的 job 互补，不是重复：
  # Linux 跑 POSIX 权限（chmod）与进程组清理；Windows 跑反斜杠路径语义与 taskkill 进程树。
  check-windows:
    name: Typecheck and Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Self-check the evaluation set
        run: npm run eval:check

  # macOS 与 Linux 同属 POSIX，但路径大小写、/tmp 别名和信号行为仍有差异；
  # 本地开发机没有 macOS，只能交给 CI 覆盖（Linux PTY 用例在 macOS 上按平台跳过）。
  check-macos:
    name: Typecheck and Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Self-check the evaluation set
        run: npm run eval:check
